[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractart"
version = "0.2.0"
description = "Unsupervised organisation of abstract paintings with vision foundation models"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.3",
    "pillow",
    "tqdm",
    "torch>=2.4",
    "transformers>=4.56",
    "safetensors",
    "tabulate",
    "evoc",
    "hdbscan",
    "umap-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
